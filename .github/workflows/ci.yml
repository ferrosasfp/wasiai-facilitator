name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA (typecheck + lint + tests + build + security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      # `npm run typecheck` uses tsconfig.json, which EXCLUDES **/*.test.ts.
      # Without this step a test file can hold a type error forever: nothing
      # else compiles it (vitest strips types, eslint is not type-aware), so a
      # double that no longer matches the interface it stands for still runs.
      - name: TypeScript typecheck (tests)
        run: npm run typecheck:tests

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Build (tsc emit to dist/)
        run: npm run build

      - name: Test coverage
        run: npm run test:coverage

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "## Test coverage"
            echo ""
            echo "Coverage table (v8) is printed in the \`Test coverage\` step log."
            echo "Full HTML report is available in the \`coverage\` artifact (retained 7 days)."
            echo ""
            if [ -f coverage/coverage-summary.json ]; then
              echo "### coverage-summary.json"
              echo '```json'
              cat coverage/coverage-summary.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Security audit (high + critical)
        run: npm run security:audit
        continue-on-error: false
