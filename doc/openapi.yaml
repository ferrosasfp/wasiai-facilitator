openapi: "3.1.0"
info:
  title: wasiai-facilitator
  version: "0.1.0"
  summary: Self-hosted x402 facilitator for EVM chains (Kite, Avalanche, extensible).
  description: |
    HTTP API for the x402 payment protocol. The facilitator validates
    EIP-3009 signed authorizations (`POST /verify`) and submits them on-chain
    (`POST /settle`). Discovery is exposed via `GET /supported`, and liveness
    via `GET /health`.

    This spec is the authoritative contract consumed by integrators
    (wasiai-a2a, wasiai-v2, third parties). It is hand-written (no code
    generation) and published verbatim at runtime via `GET /openapi.json`.

    Conformance reference: `doc/architecture/X402-CONFORMANCE.md`.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:3002
    description: Local development (default port from `src/infra/env.ts`)
  - url: https://facilitator.wasiai.example
    description: Production deployment (configure per environment)

tags:
  - name: x402
    description: x402 protocol endpoints (verify + settle).
  - name: discovery
    description: Service discovery (supported chains + methods).
  - name: ops
    description: Liveness and diagnostics.

paths:
  /verify:
    post:
      tags: [x402]
      summary: Verify an x402 payment authorization.
      description: |
        Validates an EIP-3009 `transferWithAuthorization` signed payload
        without broadcasting a transaction. Idempotent when Redis is available
        (keyed by SHA-256 of the canonical request body; see
        `src/core/idempotency.ts`).
      operationId: verifyPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: Authorization is valid and can be settled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        "400":
          description: Malformed payload, expired authorization, network mismatch, invalid amount, or invalid receiver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Invalid signature or invalid ERC-7710 delegation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "402":
          description: Insufficient balance at the authorized `from` address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "412":
          description: Permit2 allowance required (Permit2 method only).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: Simulation or transaction execution error (server-side).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: |
            Chain RPC temporarily unavailable — the per-chain circuit breaker
            is OPEN (WFAC-41). Response carries a `Retry-After` header (seconds)
            hinting when clients should retry.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds the client should wait before retrying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error:
                  code: CHAIN_UNAVAILABLE
                  message: Chain RPC temporarily unavailable
                  http: 503

  /settle:
    post:
      tags: [x402]
      summary: Submit a verified x402 payment authorization on-chain.
      description: |
        Broadcasts the `transferWithAuthorization` transaction via the
        configured chain adapter. Idempotent: re-sending the same canonical
        body while the transaction is in-flight or already mined returns the
        cached response (double-spend prevention).
      operationId: settlePayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettleRequest"
      responses:
        "200":
          description: Transaction settled on-chain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettleResponse"
        "400":
          description: Malformed payload, expired authorization, network mismatch, invalid amount, or invalid receiver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Invalid signature or invalid ERC-7710 delegation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "402":
          description: Insufficient balance at the authorized `from` address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "412":
          description: Permit2 allowance required (Permit2 method only).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: Simulation or on-chain transaction failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: |
            Chain RPC temporarily unavailable — the per-chain circuit breaker
            is OPEN (WFAC-41). Response carries a `Retry-After` header (seconds)
            hinting when clients should retry.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds the client should wait before retrying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error:
                  code: CHAIN_UNAVAILABLE
                  message: Chain RPC temporarily unavailable
                  http: 503

  /supported:
    get:
      tags: [discovery]
      summary: List supported chains and asset-transfer methods.
      description: |
        Read-only discovery endpoint. Consumers call this before `/verify` or
        `/settle` to learn which chains are registered and which methods each
        chain supports. `methods` is reported per chain and is not uniform
        across rails: EVM chains report `eip3009` (an off-chain signed
        authorization that this facilitator broadcasts), while `solana:*`
        reports `spl-token-transfer-finalized` (an SPL Token transfer the payer
        already broadcast, which this facilitator verifies at `finalized`
        commitment). On the `solana:*` rail that transfer must carry a Solana
        Pay `reference` pubkey among the transaction account keys, and the
        request must repeat it in `payload.reference` — the field is REQUIRED.
        Omitting it is rejected by the request schema with
        `400 INVALID_PAYLOAD` ("payload.reference: Required"), before any RPC
        lookup. A `reference` that is present in the request but absent from
        the transaction's account keys is rejected later with
        `400 NETWORK_MISMATCH` ("payment reference not found in tx"), even when
        mint, amount and `payTo` are correct. Branch on `chains[].methods`, not
        on the top-level `methods` union.
      operationId: listSupported
      responses:
        "200":
          description: Snapshot of the live chain registry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportedResponse"

  /health:
    get:
      tags: [ops]
      summary: Liveness probe.
      description: |
        Liveness probe. Always answers 200 while the process is up: a degraded
        dependency is reported in the body (`degraded` + `details`), never as a
        non-2xx, so a Redis or RPC blip does not get the container killed.
        Exempted from the global rate-limit plugin.

        The request never awaits a dependency probe. `details` is a
        process-cached snapshot: the probes behind it (a Redis PING and each
        adapter's own RPC probe) run in a background refresh that the request
        does not wait for, so response time does not depend on Redis or RPC
        latency.

        How old `details.probedAt` can be. 5000 ms is the age at which an
        incoming request TRIGGERS a background refresh; it is not a ceiling on
        the age of the body you get back. The request that triggers the refresh
        is answered from the PREVIOUS snapshot, and nothing outside a request
        ever refreshes it, so `probedAt` can be older than 5000 ms with no upper
        bound in the code. How much older follows from the call cadence, not
        from the threshold: once the gap between calls exceeds the threshold,
        the age of the body tracks that gap: a cron polling every four minutes
        reads a snapshot roughly four minutes old.

        What is optimistic before the first probe completes. `probedAt` is `0`
        until then, and at that point these are optimistic rather than measured:
        `degraded`, `redis.status`, and the `chains` entries' `rpc`.
        `consecutiveFailures` and `lastFailureKind` are absent then too, exactly
        as on a clean probe, so their absence does not mean a probe succeeded.
        The pre-probe body is built without waiting for the Redis PING or for
        any RPC probe, so `degraded` there is `!details.wallet.present` ALONE: a
        `false` says a signer is configured, and says nothing about Redis or the
        RPCs. `details.redis.configured` and `details.wallet.present` are read
        synchronously, so those two hold at `probedAt: 0` as well.
      operationId: getHealth
      responses:
        "200":
          description: Server is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  schemas:
    # ─── Request shapes ───────────────────────────────────────────────────

    ResourceDescriptor:
      type: object
      description: x402 resource descriptor — the asset/endpoint being paid for.
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: Absolute URL identifying the resource.
        description:
          type: string
        mimeType:
          type: string

    AcceptedExtra:
      type: object
      description: |
        Method discriminator + optional EIP-712 domain hints. Matches the
        Zod `AcceptedExtraSchema` in `src/core/schemas.ts`.
      required: [assetTransferMethod]
      additionalProperties: false
      properties:
        assetTransferMethod:
          type: string
          enum: [eip3009, permit2, erc7710]
        name:
          type: string
          description: Optional EIP-712 `name` domain hint.
        version:
          type: string
          description: Optional EIP-712 `version` domain hint.

    Accepted:
      type: object
      description: |
        Full x402 `accepted` object. Matches the Zod `AcceptedSchema`
        in `src/core/schemas.ts`.
      required: [scheme, network, amount, asset, payTo, maxTimeoutSeconds, extra]
      additionalProperties: false
      properties:
        scheme:
          const: exact
        network:
          type: string
          minLength: 1
          description: x402 chain alias (e.g. `kite-testnet`, `avalanche-fuji`).
        amount:
          type: string
          description: Canonical uint256 decimal string (no leading zeros, no scientific notation).
          pattern: "^(0|[1-9][0-9]*)$"
        asset:
          type: string
          description: 0x-prefixed 20-byte EVM address of the ERC-20 token.
          pattern: "^0x[0-9a-fA-F]{40}$"
        payTo:
          type: string
          description: 0x-prefixed 20-byte recipient EVM address.
          pattern: "^0x[0-9a-fA-F]{40}$"
        maxTimeoutSeconds:
          type: integer
          minimum: 1
          description: Maximum number of seconds this authorization remains valid.
        extra:
          $ref: "#/components/schemas/AcceptedExtra"

    Eip3009Authorization:
      type: object
      description: EIP-3009 `transferWithAuthorization` signed authorization fields.
      required: [from, to, value, validAfter, validBefore, nonce]
      additionalProperties: false
      properties:
        from:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
        to:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
        value:
          type: string
          description: Authorized token amount (canonical uint256 decimal string).
          pattern: "^(0|[1-9][0-9]*)$"
        validAfter:
          type: string
          description: Unix timestamp (seconds) — authorization is valid after this instant.
          pattern: "^(0|[1-9][0-9]*)$"
        validBefore:
          type: string
          description: Unix timestamp (seconds) — authorization expires at this instant.
          pattern: "^(0|[1-9][0-9]*)$"
        nonce:
          type: string
          description: 32-byte 0x-prefixed hex nonce (EIP-3009 single-use).
          pattern: "^0x[0-9a-fA-F]{64}$"

    Payload:
      type: object
      description: x402 `payload` — signature + authorization.
      required: [signature, authorization]
      additionalProperties: false
      properties:
        signature:
          type: string
          description: 0x-prefixed hex signature (65-byte canonical or 64-byte EIP-2098 compact).
          pattern: "^0x[0-9a-fA-F]+$"
        authorization:
          $ref: "#/components/schemas/Eip3009Authorization"

    VerifyRequest:
      type: object
      description: |
        Top-level x402 `POST /verify` request body. Mirrors
        `VerifyRequestSchema` in `src/core/schemas.ts`.
      required: [x402Version, resource, accepted, payload]
      additionalProperties: false
      properties:
        x402Version:
          const: 2
          description: x402 protocol version literal (CD-8, CD-4 — JSON Schema 2020-12 const).
        resource:
          $ref: "#/components/schemas/ResourceDescriptor"
        accepted:
          $ref: "#/components/schemas/Accepted"
        payload:
          $ref: "#/components/schemas/Payload"

    SettleRequest:
      description: |
        x402 `POST /settle` request body. The x402 spec declares this shape
        identical to `VerifyRequest` (see `SettleRequestSchema =
        VerifyRequestSchema` in `src/core/schemas.ts`). The `$ref` keeps the
        two documented schemas structurally equal.
      $ref: "#/components/schemas/VerifyRequest"

    # ─── Response shapes ──────────────────────────────────────────────────

    VerifyResponse:
      type: object
      description: |
        Successful verification. Mirrors the `VerifyResult` interface in
        `src/chains/types.ts` (sans the `ok` discriminant which is stripped
        by the route layer before serialization).
      required: [verified, client, amount, asset, network, payTo, expiresAt]
      additionalProperties: false
      properties:
        verified:
          const: true
        client:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
          description: The `from` address of the authorization (payer).
        amount:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
          description: Authorized amount in token base units (canonical uint256 decimal string).
        asset:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
        network:
          type: string
        payTo:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
        expiresAt:
          type: integer
          description: Unix timestamp (seconds) when the authorization expires (`validBefore`).

    SettleResponse:
      type: object
      description: |
        Successful settlement. Mirrors the `SettleResult` interface in
        `src/chains/types.ts` (sans the `ok` discriminant).
      required: [settled, transactionHash, blockNumber, amount, from, to, asset]
      additionalProperties: false
      properties:
        settled:
          const: true
        transactionHash:
          type: string
          description: 0x-prefixed 32-byte transaction hash.
          pattern: "^0x[0-9a-fA-F]{64}$"
        blockNumber:
          type: integer
          minimum: 0
          description: Block number at which the transaction was mined.
        amount:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
        from:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
        to:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
        asset:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"

    ChainSupportedItem:
      type: object
      description: |
        One entry per registered chain adapter. Matches
        `ChainSupportedItem` in `src/core/supported.ts`.
      required: [network, name, methods]
      additionalProperties: false
      properties:
        network:
          type: string
          description: CAIP-2 network identifier, e.g. `eip155:2368`.
        name:
          type: string
          description: Human-readable chain name, e.g. `Kite Testnet`.
        methods:
          type: array
          items:
            type: string
          description: |
            Asset-transfer methods supported by THIS chain — read per entry, it
            is not a global constant. EVM chains report `eip3009`. A
            `solana:*` chain reports `spl-token-transfer-finalized`: the payer
            broadcasts the SPL Token transfer and this facilitator verifies the
            resulting transaction at `finalized` commitment. On that path the
            facilitator does not originate the transfer. The transfer must
            carry a Solana Pay `reference` pubkey among the transaction account
            keys and the request must repeat it in `payload.reference`, which is
            REQUIRED: omitting it answers `400 INVALID_PAYLOAD`
            ("payload.reference: Required") at the schema, before any RPC
            lookup. A `reference` that is present but absent from the
            transaction's account keys answers `400 NETWORK_MISMATCH`
            ("payment reference not found in tx") even when mint, amount and
            `payTo` are correct.
        breakerState:
          type: string
          enum: [CLOSED, OPEN, HALF_OPEN]
          description: |
            WFAC-41 — current per-chain circuit breaker state. OPTIONAL: emitted
            only when the adapter exposes a live breaker (i.e., `CB_ENABLED=true`
            and the adapter is Kite / Avalanche Fuji). Omitted entirely when
            `CB_ENABLED=false` or the adapter has no breaker wrapper; in that case
            `breakerStateAbsentReason` is present and says which of the two it was.
            Integrators can branch on `breakerState === 'OPEN'` to try an
            alternate chain before issuing `/verify` or `/settle`.
        breakerStateAbsentReason:
          type: string
          enum: [NO_BREAKER, BREAKER_DISABLED, ADAPTER_LOOKUP_FAILED]
          description: |
            Why this entry carries no `breakerState`. Present in EXACTLY the entries
            where `breakerState` is absent, so every entry always has exactly one of
            the two. An entry with NEITHER field means the payload is incomplete or
            the facilitator predates this field — a case that used to be
            indistinguishable from "this chain has no breaker".

            This is NOT a breaker state and must not be read as one: `NO_BREAKER`
            does not mean healthy, it means there is nothing to look at.

            - `NO_BREAKER`: the adapter exposes no breaker at all. This is the
              `solana:*` case and it is deliberate, not a gap: the circuit breaker
              guards the EVM path where this facilitator simulates and BROADCASTS an
              EIP-3009 authorization paying its own gas, so opening it stops the
              bleeding and lets a caller pick another chain before paying. On the
              `solana:*` rail the facilitator only WITNESSES a transfer the payer
              already broadcast (verified at `finalized`), so there is no gas of ours
              to protect, and an open breaker would merely refuse payments that are
              already final on-chain.
            - `BREAKER_DISABLED`: the adapter has a breaker but it is in passthrough
              mode (`CB_ENABLED=false`), so there is no live state to report.
            - `ADAPTER_LOOKUP_FAILED`: the registry did not return the adapter for a
              chain it just listed. Unreachable by construction; if you ever see it,
              the facilitator's registry is inconsistent — do not read it as
              "no breaker".

    SupportedResponse:
      type: object
      description: |
        Discovery snapshot. Matches `SupportedResponse` in
        `src/core/supported.ts` — and that claim is now MECHANICAL, not prose:
        `T-O6` derives the expected key set by calling `getSupportedResponse()`
        and comparing it against this schema, so a field the code emits and this
        schema omits is a red test. Before WKH-342 that guard only compared the
        spec with itself, and the endpoint spent one commit serving a body this
        schema rejected (`additionalProperties: false` + `dedicatedRoutes`).
      required: [chains, methods, dedicatedRoutes]
      additionalProperties: false
      properties:
        chains:
          type: array
          items:
            $ref: "#/components/schemas/ChainSupportedItem"
        dedicatedRoutes:
          type: array
          description: |
            WKH-342 — the opt-in Solana transport routes THIS instance currently
            has registered. Always present, always an array (possibly empty).
            These are not chain adapters, so they never appeared in `chains` or
            `methods`; this field is additive and removes nothing.

            THREE outcomes a consumer can read, and there are three, not two:
            - field ABSENT from the JSON: **unknown**. The facilitator predates
              WKH-342, or something rewrote the response. It does NOT mean the
              route is missing.
            - present and CONTAINS the id: the route is registered; a POST to
              that path will not hit Fastify's default 404.
            - present and does NOT contain it: the route is not registered. `[]`
              is this answer ("none of the three"), not an absence.

            So branch on `Array.isArray(body.dedicatedRoutes)` — never on
            truthiness and never on `.length`: `[]` and `undefined` are both
            falsy and they are OPPOSITE outcomes.

            What this field does NOT say: anything about whether the route will
            AUTHORISE the call. A listed `POST /solana/payout` and a 403 from a
            daily cap coexist without contradiction — this is existence of the
            transport, not permission.
          items:
            type: string
            enum:
              - POST /solana/payout
              - POST /solana/sponsor
              - POST /solana/escrow/release
        methods:
          type: array
          items:
            type: string
          description: |
            Deduped union of every chain's `methods` array. A method listed here
            is supported by at least one registered chain, not by all of them:
            use `chains[].methods` to decide. These values name the mechanism a
            chain implements; they are not request fields. The request body is
            selected by `accepted.network`: the EVM branches carry
            `accepted.extra.assetTransferMethod` (see `AcceptedExtra`), and the
            `solana:*` branch has no `extra` at all.

    HealthResponse:
      type: object
      description: |
        Liveness response. Matches `HealthResponse` in
        `src/routes/health.ts`.
      required: [status, degraded, version, uptime, timestamp, details]
      additionalProperties: false
      properties:
        status:
          const: ok
        degraded:
          type: boolean
          description: |
            OP-05. True when any tracked dependency is not in its healthy state
            AS OF `details.probedAt`. The same value as `details.degraded` (the
            route copies the field), not an independent signal. Before the first
            probe completes (`details.probedAt` is `0`) it is
            `!details.wallet.present` ALONE: the body served then is built
            without waiting for the Redis PING or for any RPC probe, so a
            `false` there means a signer is configured, NOT that Redis and the
            RPCs answered. Read `details.probedAt` before alerting on this
            field. A `true` here does NOT mean the process is unhealthy: this
            endpoint answers 200 either way (see the endpoint description).
        version:
          type: string
          description: Server version (from `package.json#version`).
        uptime:
          type: number
          minimum: 0
          description: Process uptime in seconds (`process.uptime()`).
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 timestamp of the response.
        details:
          $ref: "#/components/schemas/HealthDetail"

    HealthDetail:
      type: object
      description: |
        OP-05. Per-dependency detail. Matches `HealthStatusDetail` in
        `src/core/health-status.ts`. Carries no secret value: the wallet entry
        is a presence boolean, never the key.
      required: [degraded, redis, wallet, chains, probedAt]
      additionalProperties: false
      properties:
        degraded:
          type: boolean
          description: |
            The OR of three conditions, as of `probedAt`: a configured Redis that
            is unreachable, `wallet.present: false`, and any `chains` entry with
            `rpc: unreachable`. A `disabled` Redis is NOT one of them. Before the
            first probe completes (`probedAt: 0`) only the second condition has
            been evaluated, because the pre-probe body is built without waiting
            for the PING or for any RPC probe; so this field is
            `!wallet.present` ALONE there, and a `false` does not mean the other
            two were checked.
        redis:
          type: object
          required: [configured, status]
          additionalProperties: false
          properties:
            configured:
              type: boolean
              description: Whether a REDIS_URL is configured (false in in-memory mode).
            status:
              type: string
              enum: [ok, unreachable, disabled]
              description: |
                `ok` means the last COMPLETED PING succeeded, or that no PING has
                completed yet: the pre-probe snapshot reports a configured Redis
                as `ok` with no PING result behind it, so read this field together
                with `probedAt` (`0` = nothing measured yet). `unreachable` means
                a completed PING failed. `disabled` (no REDIS_URL) is NOT
                degraded; only a configured-but-unreachable Redis is.
        wallet:
          type: object
          required: [present]
          additionalProperties: false
          properties:
            present:
              type: boolean
              description: |
                Whether the operator signing key is present in the environment.
                Presence only: the value is never read into the response.
                Absence IS degraded, because the facilitator cannot settle
                without a signer.
        chains:
          type: array
          items:
            $ref: "#/components/schemas/ChainHealthItem"
        probedAt:
          type: integer
          minimum: 0
          description: |
            Epoch ms when this snapshot's probes completed. `0` means no probe
            has completed yet. Before the first probe completes, these are the
            optimistic initial snapshot rather than a measurement: `degraded`,
            `redis.status`, and the `chains` entries' `rpc`. `consecutiveFailures`
            and `lastFailureKind` are absent then too, exactly as on a clean
            probe, so their absence does not mean a probe succeeded. See each of
            those fields for what it reports meanwhile. `redis.configured` and
            `wallet.present` are read synchronously, so those two hold at
            `probedAt: 0` as well. It does not mean "probed at the epoch".

    ChainHealthItem:
      type: object
      description: |
        One entry per registered chain adapter, as probed for the current
        snapshot. Matches `ChainHealth` in `src/core/health-status.ts`.
      required: [chainId, name, network, rpc]
      additionalProperties: false
      properties:
        chainId:
          type: integer
        name:
          type: string
          description: Human-readable chain name, e.g. `Kite Testnet`.
        network:
          type: string
          description: CAIP-2 network identifier, e.g. `eip155:2368`, `solana:devnet`.
        rpc:
          type: string
          enum: [ok, unreachable]
          description: |
            `ok` means the adapter's own probe answered, OR that a transient
            failure is still being tolerated, OR that no probe has completed yet:
            before the first probe completes (`probedAt: 0`) every entry reports
            `ok` with no probe behind it. `unreachable` means a hard
            failure, or a transient one at or over the tolerated threshold.
            Read it together with `consecutiveFailures`: `ok` WITH that field
            present is a tolerated blip, not a clean probe.
        consecutiveFailures:
          type: integer
          minimum: 1
          description: |
            OPTIONAL, omitted on a clean probe and before the first probe
            completes. Consecutive failed probes for this chain. Its absence
            means the last probe succeeded, or that no probe has completed yet
            (`probedAt: 0`).
        lastFailureKind:
          type: string
          enum: [transient, connection]
          description: |
            OPTIONAL, omitted on a clean probe and before the first probe
            completes (`probedAt: 0`). Classification of the last failed probe. `transient` covers a rate limit, a probe timeout,
            a gateway 5xx, a socket reset, and a TEMPORARY name-resolution
            failure (`EAI_AGAIN`); it is tolerated below the threshold, so a
            chain can carry this field and still report `rpc: 'ok'`.
            `connection` covers a refused connection, a PERMANENT
            name-resolution failure (`ENOTFOUND`), TLS, and a malformed adapter;
            it is reported on the first failed probe, with no tolerance. Name
            resolution is therefore split across BOTH values: which one you get
            depends on whether the resolver failed temporarily or permanently.

    # ─── Error envelope ───────────────────────────────────────────────────

    X402ErrorCode:
      type: string
      description: |
        Canonical x402 error code. Exactly the 11 values exported as the
        `X402ErrorCode` union from `src/core/types.ts` (10 x402 spec codes +
        CHAIN_UNAVAILABLE per WFAC-41 DT-3 Opción B).
      enum:
        - INVALID_SIGNATURE
        - INSUFFICIENT_BALANCE
        - PERMIT2_ALLOWANCE_REQUIRED
        - EXPIRED_AUTHORIZATION
        - NETWORK_MISMATCH
        - SIMULATION_FAILED
        - INVALID_AMOUNT
        - INVALID_RECEIVER
        - TRANSACTION_FAILED
        - DELEGATION_INVALID
        - CHAIN_UNAVAILABLE

    X402ErrorHttp:
      type: integer
      description: |
        HTTP status associated with the error code. Matches `HTTP_BY_CODE`
        in `src/core/errors.ts`. Values are `400`, `401`, `402`, `412`,
        `500`, or `503` (CHAIN_UNAVAILABLE per WFAC-41).
      enum: [400, 401, 402, 412, 500, 503]

    ErrorBody:
      type: object
      description: |
        Canonical x402 error envelope. CD-5: exactly three fields under
        `error` — `code`, `message`, `http` — no extras, no omissions.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, http]
          additionalProperties: false
          properties:
            code:
              $ref: "#/components/schemas/X402ErrorCode"
            message:
              type: string
              description: Human-readable English message. No PII (no addresses, no values, no chain IDs).
            http:
              $ref: "#/components/schemas/X402ErrorHttp"
